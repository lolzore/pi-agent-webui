# Pi Agent WebUI — Docker Compose for Windows 10 (Docker Desktop).
#
# Usage:
#   1. Put your API key(s) in a .env file next to this file, e.g.:
#        ANTHROPIC_API_KEY=sk-ant-...
#      (or set them in your shell before running docker compose up)
#   2. docker compose up --build
#   3. Open http://localhost:3080
#
# NOTE: the host port is 3080 (where the launcher serves a native bridge);
# override it with PI_WEBUI_PORT if something already uses it. The container's own
# port stays 3000 - only the left side of the mapping is ever worth changing.
#
# Your work is mounted from ./workspace so it survives container rebuilds,
# and pi's own data (sessions, settings, extensions, auth) lives in the named
# volume `pi_data`. To reuse a pi config you already have on the host, replace
# that volume with a bind mount, e.g.:
#   - ${USERPROFILE}\.pi:/root/.pi

services:
  pi-webui:
    build: .
    container_name: pi-webui
    ports:
      # Host port is configurable: 3080 is what the launcher uses for a native
      # bridge, so running both at once used to fail with "port is already
      # allocated" for whoever started second. PI_WEBUI_PORT=3090 docker compose up
      - "${PI_WEBUI_PORT:-3080}:3000"
    environment:
      # Pass through whichever provider keys you use:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Bridge config (defaults are fine):
      - PORT=3000
      - PI_COMMAND=pi --mode rpc
      - WORKSPACE_DIR=/workspace
      - PI_SESSION_DIR=/root/.pi/agent/sessions
      # PI_WEBUI_DEBUG_RPC=1 logs every RPC and session change to `docker logs`
      - PI_WEBUI_DEBUG_RPC=${PI_WEBUI_DEBUG_RPC:-}
    volumes:
      - ./workspace:/workspace
      - pi_data:/root/.pi
    restart: unless-stopped

volumes:
  pi_data:
